<p>cambiar-password works!</p>
<div class="page-container">

  <div class="page-header">

    <div>

      <h1>
        Cambiar contraseña
      </h1>

      <p>
        Establecer una nueva contraseña para el usuario
      </p>

    </div>

    <button
      class="btn-secondary"
      routerLink="/usuarios"
    >
      Volver
    </button>

  </div>


  <div class="form-card">

    <form
      [formGroup]="passwordForm"
      (ngSubmit)="cambiarPassword()"
    >

      <div class="form-group">

        <label>
          Nueva contraseña
        </label>

        <input
          type="password"
          formControlName="password"
          placeholder="Mínimo 8 caracteres"
        >

      </div>


      <div class="form-group">

        <label>
          Confirmar contraseña
        </label>

        <input
          type="password"
          formControlName="confirmarPassword"
        >

      </div>


      @if (errorMessage) {

        <div class="error-box">
          {{ errorMessage }}
        </div>

      }


      <div class="buttons">

        <button
          type="button"
          class="btn-secondary"
          routerLink="/usuarios"
        >
          Cancelar
        </button>

        <button
          type="submit"
          class="btn-primary"
        >
          Cambiar contraseña
        </button>

      </div>

    </form>

  </div>

</div>
